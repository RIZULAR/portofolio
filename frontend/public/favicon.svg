<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24242F" />
      <stop offset="100%" stop-color="#14141A" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="28" y1="24" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD13B" />
      <stop offset="45%" stop-color="#FDB714" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="innerHoleGrad" x1="48" y1="42" x2="78" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20202A" />
      <stop offset="100%" stop-color="#17171F" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDB714" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FDB714" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#FDB714" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Subtle Ambient Glow -->
  <rect x="7" y="7" width="114" height="114" rx="27" fill="url(#glowGrad)" />

  <!-- Stylized Monogram 'R' -->
  <g filter="url(#dropShadow)">
    <!-- Left Vertical Stem -->
    <rect x="30" y="26" width="18" height="76" rx="8" fill="url(#brandGrad)" />

    <!-- Top Loop & Angled Leg -->
    <path d="M40 26H71C83.7 26 94 36.3 94 49C94 60.1 86.2 69.4 75.8 71.4L90.4 93.2C92.8 96.8 90.2 102 85.8 102H73.8C71.3 102 69 100.7 67.6 98.5L54 74H40V26Z" fill="url(#brandGrad)" />
    
    <!-- Cutout inside loop -->
    <path d="M48 41H70C74.42 41 78 44.58 78 49C78 53.42 74.42 57 70 57H48V41Z" fill="url(#innerHoleGrad)" />
  </g>

  <!-- Active Status / Code Accent Dot -->
  <circle cx="95" cy="31" r="5.5" fill="#10B981" stroke="#1A1A22" stroke-width="1.5" />
  <circle cx="95" cy="31" r="2.5" fill="#6EE7B7" />
</svg>
